# ===============================
# CONFIGURACIÓN GENERAL
# ===============================
spring.application.name=ServicioConsultorios
server.port=8080

# ===============================
# BASE DE DATOS: PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://postgres:5432/consultorios_db
spring.datasource.username=consultorios_user
spring.datasource.password=consultorios_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.tuempresa.servicioconsultorios=DEBUG

