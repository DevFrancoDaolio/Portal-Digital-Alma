# --- Puerto del Gateway ---
server.port=8080

# --- Nombre de la aplicación (registro en Eureka) ---
spring.application.name=gateway-service

# --- Configuración de Eureka ---
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka

# --- Timeout del cliente HTTP del Gateway ---
spring.cloud.gateway.httpclient.connect-timeout=60000
spring.cloud.gateway.httpclient.response-timeout=60s

# --- Rutas del Gateway ---

# Ruta 0: Profesionales
spring.cloud.gateway.routes[0].id=profesionales-route
spring.cloud.gateway.routes[0].uri=lb://SERVICIO-PROFESIONALES
spring.cloud.gateway.routes[0].predicates[0]=Path=/profesionales/**

# Ruta 1: Pacientes
spring.cloud.gateway.routes[1].id=pacientes-route
spring.cloud.gateway.routes[1].uri=lb://SERVICIO-PACIENTES
spring.cloud.gateway.routes[1].predicates[0]=Path=/pacientes/**

# Ruta 2: Frontend (opcional para manejar la raíz /)
spring.cloud.gateway.routes[2].id=frontend-route
spring.cloud.gateway.routes[2].uri=http://frontend:80
spring.cloud.gateway.routes[2].predicates[0]=Path=/
