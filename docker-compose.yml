services:
  servicioprofesionales:
    build:
      context: ./ServicioProfesionales
      dockerfile: Dockerfile
    container_name: servicioprofesionales
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://servicioprofesionales-db:5432/servicioprofesionalesdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - servicioprofesionales-db

  servicioprofesionales-db:
    image: postgres:16
    container_name: servicioprofesionales-db
    restart: always
    environment:
      POSTGRES_DB: servicioprofesionalesdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - servicioprofesionales_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:80"
    depends_on:
      - servicioprofesionales

volumes:
  servicioprofesionales_data:
